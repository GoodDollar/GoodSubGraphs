type Minter @entity(immutable: false) {
  id: ID! # address
  totalMintCap: BigInt!
  perTxCap: BigInt!
  bps: BigInt!
  isRewardsRole: BigInt!
  totalMinted: BigInt!
  totalBurned: BigInt!
}

type MintBurnStats @entity(immutable: false) {
  id: ID!
  totalMintCap: BigInt
  totalMinted: BigInt
  totalMintDebt: BigInt
  totalRewards: BigInt
  totalBurned: BigInt
}

type InvitesStats @entity(immutable: false) {
  id: ID!
  totalApprovedInvites: BigInt!
  totalPending: BigInt!
  totalInvitersBounties: BigInt!
  totalInvited: BigInt!
}

type User @entity(immutable: false) {
  id: ID!
  invitedBy: User
  bountyPaid: Boolean!
  invitees: [User!]! @derivedFrom(field: "invitedBy")
  pending: [User!]!
  level: BigInt!
  levelStarted: BigInt!
  totalPending: BigInt!
  totalInvited: BigInt! # total invited (= totalApproved + pending)
  totalApprovedInvites: BigInt! # total joined via inviter and approved
  totalEarnedAsInviter: BigInt!
  joinedAt: BigInt!
  earnedAsInvitee: BigInt!
}

type GoodBalance @entity(immutable: false) {
  id: ID!
  "GOOD tokens minted on current blockchain"
  coreBalance: BigInt!
  "Delegated + Own undelegated GOOD on current blockchain"
  activeVotes: BigInt!
  "total activeVotes on other blockchains from state proof"
  blockchainsBalance: BigInt!
  "total voting power = activeVotes + blockchainsBalance"
  totalVotes: BigInt!
  stateProofs: [StateProof!]! @derivedFrom(field: "account")
  delegators: [GoodBalance!]! @derivedFrom(field: "delegatee")
  "account we are delegating to"
  delegatee: GoodBalance
  memberSince: BigInt!
  lastUpdate: BigInt!
}

type StateProof @entity(immutable: false) {
  id: ID!
  blockchain: String!
  account: GoodBalance!
  balance: BigInt!
  timestamp: BigInt!
}

type StateHash @entity(immutable: false) {
  id: ID!
  timestamp: BigInt!
  blockchain: String!
  merkleRoot: Bytes!
  totalSupply: BigInt!
}
